name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Compile Compact Contract
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        compact update 0.31.1 || true
        mkdir -p preprod-deployment/contracts/src/managed/bboard
        compact compile preprod-deployment/contracts/src/bboard.compact preprod-deployment/contracts/src/managed/bboard

    - name: Build Smart Contract JS
      run: cd preprod-deployment/contracts && npm run build

    - name: Run Tests
      run: npm test
